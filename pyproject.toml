[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tend"
version = "1.0.0"
description = "TEND — Text-to-NoSQL benchmark for MongoDB: construction, validation, evaluation, the SAG reference solver, and baselines"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "httpx[http2]>=0.27",
    "structlog>=24.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pymongo>=4.6",
    "jsonschema>=4.21",
    "json5>=0.9",
]

[project.optional-dependencies]
demo = [
    "flask>=3.0",
]
test = [
    "pytest>=8",
    "flask>=3.0",
]

[project.scripts]
tend = "tend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tend = ["py.typed", "baselines/assets/*.json", "baselines/assets/*.LICENSE.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "demonstration/tests"]
addopts = "-m 'not integration and not release' --strict-markers"
markers = [
    "integration: needs BIRD mini-dev and/or a live MongoDB (opt in with -m integration)",
    "release: heavyweight release/package checks (opt in with -m release)",
]
norecursedirs = [
    ".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "runs", "release", "minidev", "artifacts", "output", "drive_upload", "tmp",
    "Paper", "paper_demo", "poster_demo", "querycraft-sites", "querycraft_a0_conference_poster",
]
