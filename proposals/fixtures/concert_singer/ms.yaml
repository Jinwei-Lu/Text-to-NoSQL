MQL: |
  db.stadium.aggregate([
    { $match: { Capacity: { $gt: 5000 } } },
    { $project: { _id: 0, Name: { $ifNull: ["$Name", "(unknown)"] }, Capacity: 1 } }
  ])
mql_alt: |
  db.stadium.aggregate([
    { $match: { Capacity: { $gt: 5000 } } },
    { $project: { Name: { $ifNull: ["$Name", "(unknown)"] }, Capacity: 1, _id: 0 } }
  ])
canonical_form_set:
  must_contain: ["$match", "$ifNull"]
  must_not_contain: ["$sample", "$rand", "$$NOW", "$out", "$merge", "$function"]
  must_contain_at_root: ["$match"]
  must_not_contain_at_root: ["$group"]
shape_policy: preserve
join_depth: 0
aggregation_depth: shallow
synthesis_trace:
  primary_path: direct_compile
  converged: true
  normexec_equiv: true
  ast_check_primary: true
  ast_check_alt: true
  gold_selection: mql_primary
