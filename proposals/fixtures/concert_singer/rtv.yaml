mql_round_trip_canonical: |
  db.stadium.aggregate([
    { $match: { Capacity: { $gt: 5000 } } },
    { $project: { _id: 0, Name: { $ifNull: ["$Name", "(unknown)"] }, Capacity: 1 } }
  ])
mql_round_trip_colloquial: |
  db.stadium.aggregate([
    { $match: { Capacity: { $gt: 5000 } } },
    { $project: { _id: 0, Name: { $ifNull: ["$Name", "(unknown)"] }, Capacity: 1 } }
  ])
round_trip_verification:
  canonical_pass: true
  canonical_result_equiv: true
  colloquial_pass: true
  colloquial_result_equiv: true
  underspec_attribution: smoke fixture canonical and colloquial forms are both result-equivalent
rtv_pass: true
rtv_trace:
  retry_count: 0
  reflux_recommendation: null
