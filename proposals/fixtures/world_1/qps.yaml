intent:
  seed_mechanism: nesting
  seed_signal:
    collection: country
    array: cities
    fields: [Continent, Name, Population]
  archetype: nested_conditional_ratio
  domain_framing:
    entity_noun: country
    metric_noun: large-city share
  analytical_op:
    filter: Continent = Europe
    numerator: cities with Population > 1000000
    denominator: cities with non-null Population
    output_filter: pct > 0.3
  shape_policy: reshape
  semantic_properties:
    - id: europe_continent_filter
      expect: only Continent = Europe countries enter aggregation
    - id: null_excluding_denominator
      expect: cities with null Population excluded from numerator and denominator
    - id: pct_threshold
      expect: only pct > 0.3 retained
  reference_oracle:
    template: nested_conditional_ratio
    params:
      collection: country
      array: cities
      threshold: 0.3
  target_difficulty: L2
qps_trace:
  coverage_cell: nesting|nested_conditional_ratio|geography
  deficit_weight: 0.10
  supply_constrained: false
  rationale: Smoke fixture; per-country city population ratios under embedded cities.
