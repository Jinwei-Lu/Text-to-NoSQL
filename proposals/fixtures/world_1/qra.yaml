MQL: |
  db.country.aggregate([
    { $match: { Continent: "Europe" } },
    { $unwind: { path: "$cities", preserveNullAndEmptyArrays: false } },
    { $group: {
        _id: "$_id",
        Name: { $first: "$Name" },
        total_cities: { $sum: { $cond: [{ $ne: ["$cities.Population", null] }, 1, 0] } },
        big_cities: { $sum: { $cond: [{ $gt: ["$cities.Population", 1000000] }, 1, 0] } }
    } },
    { $project: {
        _id: 0,
        Name: 1,
        pct: { $cond: [
          { $gt: ["$total_cities", 0] },
          { $divide: ["$big_cities", "$total_cities"] },
          0
        ] }
    } },
    { $match: { pct: { $gt: 0.3 } } }
  ])
nl_queries:
  canonical: 在欧洲 (Continent = Europe) 的国家中，统计每个国家城市人口 (Population) 超过 100 万的城市占比 pct (分母为该国城市总数，分子为超百万城市数；Population 缺失的城市不计入分子分母)。只输出 pct 严格大于 0.3 的国家 Name 与 pct；不要求排序。
  colloquial: 哪些欧洲国家的大城市特别集中？
canonical_form_set:
  must_contain: ["$match", "$group", "$divide"]
  must_not_contain: []
  must_contain_at_root: ["$match"]
  must_not_contain_at_root: ["$lookup"]
shape_policy: reshape
join_depth: 0
aggregation_depth: medium
query_plan:
  primary_pattern: embed_ratio_aggregate
  null_missing_strategy: cond
qra_trace:
  translate_mql: db.country.aggregate([{ $match: { Continent: "Europe" } }, { $unwind: { path: "$cities" } }, { $group: { _id: "$_id", Name: { $first: "$Name" }, pct: { $avg: { $cond: [{ $gt: ["$cities.Population", 1000000] }, 1, 0] } } } }, { $match: { pct: { $gt: 0.3 } } }])
  generate_mql: db.country.aggregate([{ $match: { Continent: "Europe" } }, { $unwind: { path: "$cities", preserveNullAndEmptyArrays: false } }, { $group: { _id: "$_id", Name: { $first: "$Name" }, total_cities: { $sum: { $cond: [{ $ne: ["$cities.Population", null] }, 1, 0] } }, big_cities: { $sum: { $cond: [{ $gt: ["$cities.Population", 1000000] }, 1, 0] } } } }, { $project: { _id: 0, Name: 1, pct: { $cond: [{ $gt: ["$total_cities", 0] }, { $divide: ["$big_cities", "$total_cities"] }, 0] } } }, { $match: { pct: { $gt: 0.3 } } }])
  converged: true
  normexec_hash_match: true
