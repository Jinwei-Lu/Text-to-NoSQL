mql_round_trip_canonical: |
  db.country.aggregate([
    { $match: { Continent: "Europe" } },
    { $unwind: { path: "$cities", preserveNullAndEmptyArrays: false } },
    { $group: {
        _id: "$_id",
        Name: { $first: "$Name" },
        total_cities: { $sum: { $cond: [{ $ne: ["$cities.Population", null] }, 1, 0] } },
        big_cities: { $sum: { $cond: [{ $gt: ["$cities.Population", 1000000] }, 1, 0] } }
    } },
    { $project: {
        _id: 0,
        Name: 1,
        pct: { $cond: [
          { $gt: ["$total_cities", 0] },
          { $divide: ["$big_cities", "$total_cities"] },
          0
        ] }
    } },
    { $match: { pct: { $gt: 0.3 } } }
  ])
mql_round_trip_colloquial: |
  db.country.aggregate([
    { $match: { Continent: "Europe" } },
    { $unwind: { path: "$cities" } },
    { $group: {
        _id: "$_id",
        Name: { $first: "$Name" },
        pct: { $avg: { $cond: [{ $gt: ["$cities.Population", 1000000] }, 1, 0] } }
    } },
    { $match: { pct: { $gt: 0.3 } } },
    { $project: { _id: 0, Name: 1, pct: 1 } }
  ])
round_trip_verification:
  canonical_pass: true
  canonical_result_equiv: true
  colloquial_pass: false
  colloquial_result_equiv: false
  underspec_attribution: colloquial round-trip uses AVG not null-excluding ratio denominator
rtv_pass: true
rtv_trace:
  retry_count: 0
  reflux_recommendation: null
