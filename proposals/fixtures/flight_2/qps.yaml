intent:
  seed_mechanism: nesting
  seed_signal:
    collection: airlines
    array: flights
    fields: [SourceAirport, DestAirport, FlightNo]
  archetype: nested_route_frequency
  domain_framing:
    entity_noun: airline
    metric_noun: route flight count
  analytical_op:
    group_by: airline abbreviation and route pair
    metric: flight_count
    filter: flight_count > 3
    missing: Abbreviation coalesced to (unknown)
  shape_policy: reshape
  semantic_properties:
    - id: route_group_concat
      expect: route key is SourceAirport-DestAirport concat
    - id: flight_count_threshold
      expect: only routes with flight_count > 3 retained
    - id: ifNull_abbreviation
      expect: missing Abbreviation coalesced to (unknown)
  reference_oracle:
    template: nested_route_frequency
    params:
      collection: airlines
      array: flights
      threshold: 3
  target_difficulty: L2
qps_trace:
  coverage_cell: nesting|nested_route_frequency|transport
  deficit_weight: 0.14
  supply_constrained: false
  rationale: Smoke fixture; route-pair frequency under embedded flights.
