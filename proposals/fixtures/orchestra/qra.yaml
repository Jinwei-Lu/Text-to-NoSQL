MQL: |
  db.conductor.aggregate([
    { $unwind: { path: "$orchestra", preserveNullAndEmptyArrays: false } },
    { $unwind: { path: "$orchestra.performance", preserveNullAndEmptyArrays: false } },
    { $setWindowFields: {
        partitionBy: "$_id",
        sortBy: { "orchestra.performance.Performance_ID": 1 },
        output: {
          moving_avg_attendance: {
            $avg: { $ifNull: ["$orchestra.performance.Attendance", 0] },
            window: { documents: [-2, 0] }
          }
        }
    } },
    { $group: {
        _id: "$_id",
        Name: { $first: { $ifNull: ["$Name", "(unknown)"] } },
        last_window_avg: { $last: "$moving_avg_attendance" }
    } },
    { $facet: {
        per_conductor: [ { $project: { _id: 0, Name: 1, last_window_avg: 1 } } ],
        global_median: [
          { $sort: { last_window_avg: 1 } },
          { $group: { _id: null, vals: { $push: "$last_window_avg" } } },
          { $project: { _id: 0, median: { $arrayElemAt: ["$vals", { $floor: { $divide: [{ $size: "$vals" }, 2] } }] } } }
        ]
    } },
    { $project: {
        kept: { $filter: {
          input: "$per_conductor",
          as: "c",
          cond: { $gt: ["$$c.last_window_avg", { $arrayElemAt: ["$global_median.median", 0] }] }
        } }
    } },
    { $unwind: "$kept" },
    { $project: { _id: 0, Name: "$kept.Name", last_window_avg: "$kept.last_window_avg" } }
  ])
nl_queries:
  canonical: 对每位 conductor，先在其指挥的 orchestra 的 performance 上按 Performance_ID 升序、对 Attendance 计算窗口大小为 (当前, 前 2 场) 的滑动平均；取该 conductor 的最后一次窗口平均值作为代表值 (Attendance 缺失视为 0)。然后计算所有 conductor 代表值的中位数。最终只输出代表值严格大于该中位数的 conductor，字段为 Name 与 last_window_avg；若 Name 缺失则显示为 (unknown)；不要求排序。
  colloquial: 列出最近场次出勤趋势高于同行中位数的指挥。
canonical_form_set:
  must_contain: ["$setWindowFields", "$facet", "$ifNull"]
  must_not_contain: []
  must_contain_at_root: ["$setWindowFields", "$facet"]
  must_not_contain_at_root: []
shape_policy: reshape
join_depth: 0
aggregation_depth: deep
query_plan:
  primary_pattern: window_facet_filter
  null_missing_strategy: ifNull
qra_trace:
  translate_mql: db.conductor.aggregate([{ $unwind: { path: "$orchestra" } }, { $setWindowFields: { partitionBy: "$_id", output: { moving_avg_attendance: { $avg: { $ifNull: ["$orchestra.performance.Attendance", 0] }, window: { documents: [-2, 0] } } } } }, { $facet: { per_conductor: [], global_median: [] } }])
  generate_mql: db.conductor.aggregate([{ $unwind: { path: "$orchestra", preserveNullAndEmptyArrays: false } }, { $unwind: { path: "$orchestra.performance", preserveNullAndEmptyArrays: false } }, { $setWindowFields: { partitionBy: "$_id", sortBy: { "orchestra.performance.Performance_ID": 1 }, output: { moving_avg_attendance: { $avg: { $ifNull: ["$orchestra.performance.Attendance", 0] }, window: { documents: [-2, 0] } } } } }, { $group: { _id: "$_id", Name: { $first: { $ifNull: ["$Name", "(unknown)"] } }, last_window_avg: { $last: "$moving_avg_attendance" } } }, { $facet: { per_conductor: [ { $project: { _id: 0, Name: 1, last_window_avg: 1 } } ], global_median: [ { $sort: { last_window_avg: 1 } }, { $group: { _id: null, vals: { $push: "$last_window_avg" } } }, { $project: { _id: 0, median: { $arrayElemAt: ["$vals", { $floor: { $divide: [{ $size: "$vals" }, 2] } }] } } } ] } }, { $project: { kept: { $filter: { input: "$per_conductor", as: "c", cond: { $gt: ["$$c.last_window_avg", { $arrayElemAt: ["$global_median.median", 0] }] } } } } }, { $unwind: "$kept" }, { $project: { _id: 0, Name: "$kept.Name", last_window_avg: "$kept.last_window_avg" } }])
  converged: true
  normexec_hash_match: true
