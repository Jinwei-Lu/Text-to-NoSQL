query_plan:
  primary_pattern: dynamic_key_aggregation
  operator_graph:
    stages: ["$project", "$unwind", "$match", "$group", "$sort", "$group", "$project"]
    dependencies:
      - $objectToArray unfold metrics object
      - filter keys weight and priority
      - rank by avg_value descending
  shape_policy: reshape
  null_missing_strategy: none
  target_difficulty: L4
  schema_flex_mode: dynamic_key
  join_depth_target: 0
  aggregation_depth_target: medium
  target_fields:
    - document_id
    - metrics
    - title
  semantic_properties:
    - id: key_filter_weight_priority
      expect: only weight and priority keys enter aggregation
    - id: top_metric_singleton
      expect: output is single top_metric object with highest avg
    - id: objectToArray_required
      expect: dynamic keys treated as values not static columns
qps_trace:
  coverage_cell: L4|structural_schema_flex|schema_flex_dynamic_key
  deficit_weight: 0.20
  supply_constrained: false
  pattern_rationale: scenario_summary emphasizes EAV attribute aggregation; H4 dynamic-key metrics on documents
