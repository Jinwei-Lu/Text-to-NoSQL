db_id: cre_doc_tracking_db
source_spider_tables:
  - Documents
  - Document_Attributes
patterns_applied: [embed]
rationale_summary: >
  Single documents collection with dynamic-key metrics object promoted from real EAV attribute rows.
decisions:
  - id: D01
    type: embed
    parent: documents
    child: metrics
    rationale: WP AP01 eav_attribute_lookup 0.61; fold attribute_name/value into metrics map.
    reference: access_patterns.AP01
  - id: D02
    type: attribute
    parent: documents
    child: metrics
    rationale: dynamic_key mechanism fired; Document_Attributes rows become dynamic keys under metrics.
    reference: heterogenization.triggers.dynamic_key
heterogenization:
  schema_flex: dynamic_key
  triggers:
    - mechanism: dynamic_key
      fired: true
      evidence: Document_Attributes EAV shape; entity_id=document_id; name/value columns
    - mechanism: polymorphic
      fired: false
      evidence: no type_conditional_rate >= 0.30
    - mechanism: sparse
      fired: false
      evidence: sparse_null_cols=0
    - mechanism: version
      fired: false
      evidence: no temporal rename pair
anti_pattern_checks:
  pass: true
  issues: []
