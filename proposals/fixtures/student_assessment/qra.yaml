MQL: |
  db.students.aggregate([
    { $unwind: { path: "$assessments", preserveNullAndEmptyArrays: false } },
    { $addFields: {
        norm_score: {
          $switch: {
            branches: [
              { case: { $eq: ["$assessments.__type", "written"] },
                then: { $multiply: [
                  { $divide: [
                    { $ifNull: ["$assessments.written_score", 0] },
                    { $max: [{ $ifNull: ["$assessments.word_count", 1] }, 1] }
                  ] },
                  100
                ] } },
              { case: { $eq: ["$assessments.__type", "oral"] },
                then: { $ifNull: ["$assessments.oral_score", 0] } },
              { case: { $eq: ["$assessments.__type", "practical"] },
                then: { $ifNull: ["$assessments.lab_score", 0] } }
            ],
            default: 0
          }
        }
    } },
    { $group: {
        _id: "$_id",
        first_name: { $first: { $ifNull: ["$first_name", "(unknown)"] } },
        final_score: { $max: "$norm_score" }
    } },
    { $project: { _id: 0, first_name: 1, final_score: 1 } }
  ])
nl_queries:
  canonical: 对每位学生，将其各次评估按评估类型分别归一化：written 类型用 written_score 除以 word_count 再乘以 100；oral 类型用 oral_score；practical 类型用 lab_score；取各类型归一化分的最大值作为 final_score；输出 first_name 与 final_score；若 first_name 缺失则显示为 (unknown)；不要求排序。
  colloquial: 按不同考核方式算分，看谁综合表现最好。
canonical_form_set:
  must_contain: ["$switch", "$unwind", "$ifNull"]
  must_not_contain: ["$setWindowFields", "$facet"]
  must_contain_at_root: ["$unwind"]
  must_not_contain_at_root: []
shape_policy: reshape
schema_flex: polymorphic
join_depth: 0
aggregation_depth: medium
query_plan:
  primary_pattern: polymorphic_dispatch
  null_missing_strategy: ifNull
qra_trace:
  translate_mql: db.students.aggregate([{ $unwind: "$assessments" }, { $group: { _id: "$_id", first_name: { $first: "$first_name" }, final_score: { $max: "$assessments.score" } } }])
  generate_mql: db.students.aggregate([{ $unwind: "$assessments" }, { $addFields: { norm_score: { $switch: { branches: [...], default: 0 } } } }, { $group: { _id: "$_id", first_name: { $first: { $ifNull: ["$first_name", "(unknown)"] } }, final_score: { $max: "$norm_score" } } }])
  converged: true
  normexec_hash_match: true
