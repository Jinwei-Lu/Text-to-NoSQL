intent:
  seed_mechanism: polymorphic
  seed_signal:
    collection: students
    array: assessments
    discriminator: assessment_type
    values: [written, oral, practical]
  archetype: per_subtype_score_normalization
  domain_framing:
    entity_noun: student
    metric_noun: final_score
  analytical_op:
    dispatch: normalize score by assessment_type
    aggregate: max normalized score per student
    missing: first_name coalesced to (unknown)
  shape_policy: reshape
  semantic_properties:
    - id: written_score_per_word
      expect: written branch divides score by word_count capped at 1
    - id: max_across_assessment_types
      expect: final_score is max of normalized per-type scores
    - id: ifNull_first_name
      expect: missing first_name coalesced to (unknown)
    - id: polymorphic_branch_coverage
      expect: all three assessment_type branches reachable on witness D
  reference_oracle:
    template: per_subtype_score_normalization
    params:
      collection: students
      discriminator: assessment_type
      branches: [written, oral, practical]
  target_difficulty: L4
qps_trace:
  coverage_cell: polymorphic|per_subtype_score_normalization|education
  deficit_weight: 0.22
  supply_constrained: false
  rationale: Smoke fixture; type-conditional assessment scoring uses a real discriminator column.
