[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tend-benchmark"
version = "0.1.0"
description = "Initial scaffold for the TEND benchmark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "json5",
  "openai",
  "pymongo",
]

[project.scripts]
tend-benchmark = "tend_benchmark.cli:main"
tend-construct = "tend_construct.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
