MQL: "db.airlines.aggregate([\n  {\n    \"$unwind\": {\n      \"path\": \"$orchestra\"\
  ,\n      \"preserveNullAndEmptyArrays\": false\n    }\n  },\n  {\n    \"$unwind\"\
  : {\n      \"path\": \"$orchestra.performance\",\n      \"preserveNullAndEmptyArrays\"\
  : false\n    }\n  },\n  {\n    \"$setWindowFields\": {\n      \"partitionBy\": \"\
  $_id\",\n      \"sortBy\": {\n        \"orchestra.performance.Performance_ID\":\
  \ 1\n      },\n      \"output\": {\n        \"moving_avg_attendance\": {\n     \
  \     \"$avg\": {\n            \"$ifNull\": [\n              \"$orchestra.performance.Attendance\"\
  ,\n              0\n            ]\n          },\n          \"window\": {\n     \
  \       \"documents\": [\n              -2,\n              0\n            ]\n  \
  \        }\n        }\n      }\n    }\n  },\n  {\n    \"$group\": {\n      \"_id\"\
  : \"$_id\",\n      \"Name\": {\n        \"$first\": {\n          \"$ifNull\": [\n\
  \            \"$Name\",\n            \"(unknown)\"\n          ]\n        }\n   \
  \   },\n      \"last_window_avg\": {\n        \"$last\": \"$moving_avg_attendance\"\
  \n      }\n    }\n  },\n  {\n    \"$facet\": {\n      \"per_conductor\": [\n   \
  \     {\n          \"$project\": {\n            \"_id\": 0,\n            \"Name\"\
  : 1,\n            \"last_window_avg\": 1\n          }\n        }\n      ],\n   \
  \   \"global_median\": [\n        {\n          \"$sort\": {\n            \"last_window_avg\"\
  : 1\n          }\n        },\n        {\n          \"$group\": {\n            \"\
  _id\": null,\n            \"vals\": {\n              \"$push\": \"$last_window_avg\"\
  \n            }\n          }\n        },\n        {\n          \"$project\": {\n\
  \            \"_id\": 0,\n            \"median\": {\n              \"$arrayElemAt\"\
  : [\n                \"$vals\",\n                {\n                  \"$floor\"\
  : {\n                    \"$divide\": [\n                      {\n             \
  \           \"$size\": \"$vals\"\n                      },\n                   \
  \   2\n                    ]\n                  }\n                }\n         \
  \     ]\n            }\n          }\n        }\n      ]\n    }\n  },\n  {\n    \"\
  $project\": {\n      \"kept\": {\n        \"$filter\": {\n          \"input\": \"\
  $per_conductor\",\n          \"as\": \"c\",\n          \"cond\": {\n           \
  \ \"$gt\": [\n              \"$$c.last_window_avg\",\n              {\n        \
  \        \"$arrayElemAt\": [\n                  \"$global_median.median\",\n   \
  \               0\n                ]\n              }\n            ]\n         \
  \ }\n        }\n      }\n    }\n  },\n  {\n    \"$unwind\": \"$kept\"\n  },\n  {\n\
  \    \"$project\": {\n      \"_id\": 0,\n      \"Name\": \"$kept.Name\",\n     \
  \ \"last_window_avg\": \"$kept.last_window_avg\"\n    }\n  }\n])"
