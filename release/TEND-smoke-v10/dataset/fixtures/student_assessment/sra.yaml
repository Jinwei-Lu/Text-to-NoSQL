db_id: student_assessment
source_spider_tables:
  - Addresses
  - People
  - Students
  - Courses
  - People_Addresses
  - Student_Course_Registrations
  - Student_Course_Attendance
  - Candidates
  - Candidate_Assessments
patterns_applied: [embed, polymorphic]
rationale_summary: >
  Student-root embed with polymorphic assessments[] via H1 Stage B; per-type score
  fields require $switch dispatch in Phase B queries.
decisions:
  - id: D01
    type: computed
    parent: students
    child: people
    rationale: WP AP02 co_access 0.68; denormalize first_name and last_name onto student root.
    reference: access_patterns.AP02
  - id: D02
    type: embed
    parent: students
    child: courses
    rationale: WP AP01 frequency 0.46; course cardinality filters need courses[] on student doc.
    reference: access_patterns.AP01
  - id: D03
    type: embed
    parent: students
    child: assessments
    rationale: WP AP03 type_conditional 0.36; assessment outcomes branch on assessment_type.
    reference: access_patterns.AP03
  - id: D04
    type: polymorphic_collapse
    parent: students
    child: assessments
    rationale: H1 fired; __variants declare written/oral/practical field sets on assessments[].
    reference: heterogenization.triggers.H1
heterogenization:
  schema_flex: polymorphic
  triggers:
    - id: H1
      fired: true
      evidence: Candidate_Assessments.assessment_type; type_conditional_rate=0.36
    - id: H2
      fired: false
      evidence: sparse_null_cols=1 (<3 threshold)
    - id: H3
      fired: false
      evidence: no column rename pair detected
    - id: H4
      fired: false
      evidence: no EAV table shape
anti_pattern_checks:
  pass: true
  issues: []
