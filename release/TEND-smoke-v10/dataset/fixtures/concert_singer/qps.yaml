query_plan:
  primary_pattern: simple_filter
  operator_graph:
    stages: ["$match", "$project"]
    dependencies:
      - Capacity threshold predicate on stadium root
      - Name projection with ifNull coalesce
  shape_policy: preserve
  null_missing_strategy: ifNull
  target_difficulty: L1
  schema_flex_mode: none
  join_depth_target: 0
  aggregation_depth_target: shallow
  target_fields:
    - stadium.Name
    - stadium.Capacity
  semantic_properties:
    - id: capacity_threshold_strict
      expect: only Capacity > 5000 retained
    - id: ifNull_name
      expect: missing Name coalesced to (unknown)
    - id: result_non_empty
      expect: witness has at least one large-capacity stadium
qps_trace:
  coverage_cell: L1|feasible|schema_flex_none
  deficit_weight: 0.12
  supply_constrained: false
  pattern_rationale: scenario_summary emphasizes capacity filters on stadium root; low-deficit L1 cell
