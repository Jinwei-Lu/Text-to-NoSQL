query_plan:
  primary_pattern: nested_unwind
  operator_graph:
    stages: ["$unwind", "$group", "$match", "$project"]
    dependencies:
      - unwind embedded flights array
      - group by airline abbreviation and route pair
      - sum flight counts per route
  shape_policy: reshape
  null_missing_strategy: ifNull
  target_difficulty: L2
  schema_flex_mode: none
  join_depth_target: 0
  aggregation_depth_target: medium
  target_fields:
    - airlines.Abbreviation
    - flights.SourceAirport
    - flights.DestAirport
    - flights.FlightNo
  semantic_properties:
    - id: route_group_concat
      expect: route key is SourceAirport-DestAirport concat
    - id: flight_count_threshold
      expect: only routes with flight_count > 3 retained
    - id: ifNull_abbreviation
      expect: missing Abbreviation coalesced to (unknown)
qps_trace:
  coverage_cell: L2|semantic|schema_flex_none
  deficit_weight: 0.14
  supply_constrained: false
  pattern_rationale: scenario_summary emphasizes route-pair frequency under embedded flights; medium aggregation without windows
