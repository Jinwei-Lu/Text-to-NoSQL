[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tend"
version = "0.1.0"
description = "TEND dataset construction and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
  "structlog>=24.1",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pymongo>=4.6",
  "jsonschema>=4.21",
  "sqlglot>=25.0",
  "json5>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tend-mongosh-smoke = "tend.cli.mongosh_smoke:main"
tend-pool-disjoint = "tend.cli.assert_pool_disjoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
