mql_round_trip_canonical: |
  db.students.aggregate([
    { $unwind: { path: "$assessments", preserveNullAndEmptyArrays: false } },
    { $addFields: {
        norm_score: {
          $switch: {
            branches: [
              { case: { $eq: ["$assessments.__type", "written"] },
                then: { $multiply: [
                  { $divide: [
                    { $ifNull: ["$assessments.written_score", 0] },
                    { $max: [{ $ifNull: ["$assessments.word_count", 1] }, 1] }
                  ] },
                  100
                ] } },
              { case: { $eq: ["$assessments.__type", "oral"] },
                then: { $ifNull: ["$assessments.oral_score", 0] } },
              { case: { $eq: ["$assessments.__type", "practical"] },
                then: { $ifNull: ["$assessments.lab_score", 0] } }
            ],
            default: 0
          }
        }
    } },
    { $group: {
        _id: "$_id",
        first_name: { $first: { $ifNull: ["$first_name", "(unknown)"] } },
        final_score: { $max: "$norm_score" }
    } },
    { $project: { _id: 0, first_name: 1, final_score: 1 } }
  ])
mql_round_trip_colloquial: |
  db.students.aggregate([
    { $unwind: { path: "$assessments" } },
    { $group: { _id: "$_id", first_name: { $first: "$first_name" }, final_score: { $max: "$assessments.score" } } },
    { $project: { _id: 0, first_name: 1, final_score: 1 } }
  ])
round_trip_verification:
  canonical_pass: true
  canonical_ex: true
  canonical_ast_check: true
  colloquial_pass: false
  colloquial_ex: false
  colloquial_ast_check: true
  underspec_attribution: colloquial omits per-type normalization rules and $switch dispatch
rtv_pass: true
rtv_trace:
  retry_count: 0
  reflux_recommendation: null
