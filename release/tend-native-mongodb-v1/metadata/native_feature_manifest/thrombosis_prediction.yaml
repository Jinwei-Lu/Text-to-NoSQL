db_id: thrombosis_prediction
features:
- id: patient_clinical_profiles.lab_timeline_year_matrix
  type: dynamic_key_object
  collection: patient_clinical_profiles
  field: timeline.lab_panels_by_year
  supported_query_patterns:
  - lab_year_panel_code_matrix
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  - $size
  provenance_refs:
  - Laboratory.Date
  - Laboratory.GOT
  - Laboratory.GPT
  - Laboratory.LDH
  - Laboratory.PLT
  - Laboratory.PT
  - Laboratory.APTT
  - Laboratory.FG
  - Laboratory.PIC
  - Laboratory.TAT
  - Laboratory.CRP
  - Laboratory.DNA
  - Laboratory.DNA-II
  - Laboratory.WBC
  - Laboratory.RBC
  - Laboratory.HGB
  - Laboratory.C3
  - Laboratory.C4
  - Laboratory.RNP
  coverage: {}
  pipeline_blueprints:
  - query_pattern: lab_year_panel_code_matrix
    intent: roll up year-keyed lab panel buckets and measurement-code bags
    pipeline:
    - $project:
        patient_id: $identity.patient_id
        years:
          $objectToArray: $timeline.lab_panels_by_year
    - $unwind: $years
    - $unwind: $years.v.panels
    - $project:
        year: $years.k
        patient_id: 1
        present_code_count: $years.v.panels.panel_state.present_code_count
        codes:
          $objectToArray: $years.v.panels.measurements_by_code
    - $unwind: $codes
    - $group:
        _id:
          year: $year
          code: $codes.k
          state: $codes.v.presence_state
        reading_count:
          $sum: 1
        patient_ids:
          $addToSet: $patient_id
        present_code_total:
          $sum: $present_code_count
    - $project:
        _id: 0
        year: $_id.year
        code: $_id.code
        state: $_id.state
        reading_count: 1
        patient_count:
          $size: $patient_ids
        present_code_total: 1
    - $sort:
        year: 1
        code: 1
        state: 1
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
    - $size
- id: patient_clinical_profiles.thrombosis_diagnosis_events
  type: nested_event_stream
  collection: patient_clinical_profiles
  field: timeline.events
  supported_query_patterns:
  - thrombosis_event_evidence_filter
  required_native_constructs:
  - $filter
  - $ifNull
  - $objectToArray
  - $size
  provenance_refs:
  - Examination.Examination Date
  - Examination.Diagnosis
  - Examination.Thrombosis
  - Examination.aCL IgG
  - Examination.aCL IgM
  - Examination.aCL IgA
  - Examination.ANA
  - Examination.KCT
  - Examination.RVVT
  - Examination.LAC
  coverage: {}
  pipeline_blueprints:
  - query_pattern: thrombosis_event_evidence_filter
    intent: filter patient event streams for thrombosis-positive diagnosis evidence
    pipeline:
    - $project:
        patient_id: $identity.patient_id
        matching_events:
          $filter:
            input:
              $ifNull:
              - $timeline.events
              - []
            as: event
            cond:
              $eq:
              - $$event.thrombosis.state
              - positive
    - $match:
        $expr:
          $gt:
          - $size: $matching_events
          - 0
    - $project:
        patient_id: 1
        matching_events: 1
    mongo_native_constructs:
    - $filter
    - $ifNull
    - $size
- id: diagnosis_risk_panels.risk_group_patient_matrix
  type: dynamic_key_object
  collection: diagnosis_risk_panels
  field: patients_by_risk_group
  supported_query_patterns:
  - diagnosis_risk_group_patient_matrix
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  provenance_refs:
  - Patient.Diagnosis
  - Patient.Admission
  - Examination.Thrombosis
  coverage: {}
  pipeline_blueprints:
  - query_pattern: diagnosis_risk_group_patient_matrix
    intent: compare diagnosis panels through dynamic risk-group patient buckets
    pipeline:
    - $project:
        diagnosis_group: 1
        risk_groups:
          $objectToArray: $patients_by_risk_group
    - $unwind: $risk_groups
    - $unwind: $risk_groups.v
    - $group:
        _id:
          diagnosis_group: $diagnosis_group
          risk_group: $risk_groups.k
        patient_count:
          $sum: 1
    - $sort:
        patient_count: -1
        _id.diagnosis_group: 1
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
- id: measurement_code_bags.yearly_measurement_distribution
  type: dynamic_key_object
  collection: measurement_code_bags
  field: values_by_year
  supported_query_patterns:
  - measurement_code_year_distribution
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  provenance_refs:
  - Laboratory.Date
  - Laboratory.GOT
  - Laboratory.GPT
  - Laboratory.LDH
  - Laboratory.PLT
  - Laboratory.PT
  - Laboratory.APTT
  - Laboratory.FG
  - Laboratory.PIC
  - Laboratory.TAT
  - Laboratory.CRP
  - Laboratory.DNA
  - Laboratory.DNA-II
  - Laboratory.WBC
  - Laboratory.RBC
  - Laboratory.HGB
  - Laboratory.C3
  - Laboratory.C4
  - Laboratory.RNP
  - Examination.Examination Date
  - Examination.aCL IgG
  - Examination.aCL IgM
  - Examination.aCL IgA
  - Examination.ANA
  - Examination.KCT
  - Examination.RVVT
  - Examination.LAC
  coverage: {}
  pipeline_blueprints:
  - query_pattern: measurement_code_year_distribution
    intent: fold code-bag readings through dynamic year buckets
    pipeline:
    - $project:
        code: 1
        semantic_group: 1
        years:
          $objectToArray: $values_by_year
    - $unwind: $years
    - $group:
        _id:
          code: $code
          year: $years.k
          group: $semantic_group
        reading_count:
          $sum: $years.v.reading_count
    - $sort:
        reading_count: -1
        _id.code: 1
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
