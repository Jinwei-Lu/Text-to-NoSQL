db_id: codebase_community
features:
- id: community_threads.tag_thread_matrix
  type: dynamic_key_object
  collection: community_threads
  field: taxonomy.tags_by_name
  supported_query_patterns:
  - community_tag_thread_matrix
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  provenance_refs:
  - posts.Id
  - posts.Tags
  - posts.AcceptedAnswerId
  - tags.TagName
  - tags.Count
  coverage: {}
  pipeline_blueprints:
  - query_pattern: community_tag_thread_matrix
    intent: traverse dynamic tag keys and count question-thread states by tag
    pipeline:
    - $project:
        question_id: $identity.question_id
        tags:
          $objectToArray: $taxonomy.tags_by_name
    - $unwind: $tags
    - $unwind: $tags.v.threads
    - $group:
        _id:
          tag: $tags.k
          status: $tags.v.threads.status_bucket
        thread_count:
          $sum: 1
    - $sort:
        thread_count: -1
        _id.tag: 1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
- id: community_threads.answer_vote_buckets
  type: array_object_dynamic_keys
  collection: community_threads
  field: answers.items.votes_by_type
  supported_query_patterns:
  - community_answer_vote_bucket_scan
  required_native_constructs:
  - $unwind
  - $objectToArray
  - $filter
  - $sum
  provenance_refs:
  - posts.Id
  - posts.ParentId
  - votes.PostId
  - votes.VoteTypeId
  - votes.BountyAmount
  coverage: {}
  pipeline_blueprints:
  - query_pattern: community_answer_vote_bucket_scan
    intent: scan answer arrays and explode each answer's dynamic vote-type buckets
    pipeline:
    - $unwind: $answers.items
    - $project:
        question_id: $identity.question_id
        answer_id: $answers.items.answer_id
        vote_types:
          $objectToArray: $answers.items.votes_by_type
    - $addFields:
        positive_vote_types:
          $filter:
            input: $vote_types
            as: vote
            cond:
              $gt:
              - $$vote.v.count
              - 0
    - $unwind: $positive_vote_types
    - $group:
        _id: $positive_vote_types.k
        answer_count:
          $sum: 1
        vote_total:
          $sum: $positive_vote_types.v.count
    - $sort:
        vote_total: -1
    - $limit: 50
    mongo_native_constructs:
    - $unwind
    - $objectToArray
    - $filter
    - $group
    - $sum
- id: user_reputation_profiles.reputation_activity_lattice
  type: dynamic_key_object
  collection: user_reputation_profiles
  field: activity.by_year
  supported_query_patterns:
  - community_user_reputation_activity_lattice
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $avg
  provenance_refs:
  - users.Id
  - users.Reputation
  - posts.OwnerUserId
  - posts.CreaionDate
  - comments.UserId
  coverage: {}
  pipeline_blueprints:
  - query_pattern: community_user_reputation_activity_lattice
    intent: compare reputation buckets across year-keyed user activity lattices
    pipeline:
    - $project:
        user_id: $identity.user_id
        reputation_bucket: $reputation.bucket
        years:
          $objectToArray: $activity.by_year
    - $unwind: $years
    - $project:
        reputation_bucket: 1
        year: $years.k
        activity_buckets:
          $objectToArray: $years.v
    - $unwind: $activity_buckets
    - $group:
        _id:
          reputation_bucket: $reputation_bucket
          bucket: $activity_buckets.k
        avg_events:
          $avg: $activity_buckets.v.count
        users:
          $sum: 1
    - $sort:
        users: -1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $avg
- id: tag_topic_ecosystems.topic_status_year_buckets
  type: dynamic_key_object
  collection: tag_topic_ecosystems
  field: threads_by_status_by_year
  supported_query_patterns:
  - community_topic_status_year_buckets
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $size
  - $group
  provenance_refs:
  - tags.TagName
  - tags.Count
  - posts.Tags
  - posts.ClosedDate
  - posts.AcceptedAnswerId
  coverage: {}
  pipeline_blueprints:
  - query_pattern: community_topic_status_year_buckets
    intent: walk topic status buckets and compare year-keyed thread arrays
    pipeline:
    - $project:
        tag: $identity.tag_name
        statuses:
          $objectToArray: $threads_by_status_by_year
    - $unwind: $statuses
    - $project:
        tag: 1
        status: $statuses.k
        years:
          $objectToArray: $statuses.v
    - $unwind: $years
    - $project:
        tag: 1
        status: 1
        year: $years.k
        thread_count:
          $size: $years.v.threads
    - $group:
        _id:
          status: $status
          year: $year
        tags:
          $sum: 1
        threads:
          $sum: $thread_count
    - $sort:
        threads: -1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $size
    - $group
    - $sum
