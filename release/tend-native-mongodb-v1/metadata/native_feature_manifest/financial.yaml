db_id: financial
features:
- id: account_ledgers.monthly_activity_matrix
  type: dynamic_key_object
  collection: account_ledgers
  field: cashflow.activity_by_month
  supported_query_patterns:
  - monthly_account_cashflow_matrix
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  - $size
  provenance_refs:
  - trans.date
  - trans.amount
  - trans.type
  - trans.operation
  - trans.k_symbol
  coverage: {}
  pipeline_blueprints:
  - query_pattern: monthly_account_cashflow_matrix
    intent: roll up account cash-flow entries from month-keyed ledger buckets
    pipeline:
    - $project:
        account_id: $identity.account_id
        months:
          $objectToArray: $cashflow.activity_by_month
    - $unwind: $months
    - $unwind: $months.v.entries
    - $group:
        _id:
          month: $months.k
          flow_type: $months.v.entries.flow.type
        amount_total:
          $sum: $months.v.entries.amount
        transaction_count:
          $sum: 1
        accounts:
          $addToSet: $account_id
    - $project:
        _id: 0
        month: $_id.month
        flow_type: $_id.flow_type
        amount_total: 1
        transaction_count: 1
        account_count:
          $size: $accounts
    - $sort:
        month: 1
        flow_type: 1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
    - $size
- id: account_ledgers.loan_repayment_schedule
  type: dynamic_key_object
  collection: account_ledgers
  field: loan.repayment_schedule.by_due_month
  supported_query_patterns:
  - loan_status_repayment_schedule
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  provenance_refs:
  - loan.date
  - loan.amount
  - loan.duration
  - loan.payments
  - loan.status
  coverage: {}
  pipeline_blueprints:
  - query_pattern: loan_status_repayment_schedule
    intent: compare scheduled loan exposure by loan status across due-month keys
    pipeline:
    - $match:
        loan.contract.presence_state: present
    - $project:
        status_bucket: $loan.contract.status_bucket
        schedule:
          $objectToArray: $loan.repayment_schedule.by_due_month
    - $unwind: $schedule
    - $group:
        _id:
          status_bucket: $status_bucket
          due_month: $schedule.k
        scheduled_payment_total:
          $sum: $schedule.v.scheduled_payment
        principal_remaining_total:
          $sum: $schedule.v.scheduled_principal_remaining
        loan_accounts:
          $sum: 1
    - $sort:
        _id.status_bucket: 1
        _id.due_month: 1
    - $limit: 60
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
- id: party_relationship_graphs.disposition_party_network
  type: dynamic_key_object
  collection: party_relationship_graphs
  field: relationships.members_by_role
  supported_query_patterns:
  - disposition_role_card_network
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $ifNull
  provenance_refs:
  - disp.type
  - disp.client_id
  - client.gender
  - card.type
  coverage: {}
  pipeline_blueprints:
  - query_pattern: disposition_role_card_network
    intent: traverse role-keyed disposition members and card facets in account party
      graphs
    pipeline:
    - $project:
        account_id: $account.account_id
        roles:
          $objectToArray: $relationships.members_by_role
    - $unwind: $roles
    - $unwind: $roles.v
    - $project:
        role: $roles.k
        gender: $roles.v.client.gender.value
        card_count:
          $size:
            $ifNull:
            - $roles.v.cards
            - []
    - $group:
        _id:
          role: $role
          gender: $gender
        member_count:
          $sum: 1
        card_count:
          $sum: $card_count
    - $sort:
        member_count: -1
        _id.role: 1
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $ifNull
    - $size
- id: district_market_contexts.account_market_segments
  type: dynamic_key_object
  collection: district_market_contexts
  field: accounts_by_frequency
  supported_query_patterns:
  - district_salary_frequency_segments
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  provenance_refs:
  - district.A11
  - district.A3
  - account.frequency
  - account.account_id
  coverage: {}
  pipeline_blueprints:
  - query_pattern: district_salary_frequency_segments
    intent: fold account frequency buckets through district salary and region context
    pipeline:
    - $project:
        region: $district.region
        salary_band: $salary_band
        frequency_accounts:
          $objectToArray: $accounts_by_frequency
    - $unwind: $frequency_accounts
    - $unwind: $frequency_accounts.v
    - $group:
        _id:
          region: $region
          salary_band: $salary_band
          frequency: $frequency_accounts.k
        account_count:
          $sum: 1
        loan_accounts:
          $sum:
            $cond:
            - $eq:
              - $frequency_accounts.v.loan_presence_state
              - present
            - 1
            - 0
    - $sort:
        account_count: -1
        _id.region: 1
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
    - $cond
- id: counterparty_flow_profiles.bank_symbol_flow_matrix
  type: dynamic_key_object
  collection: counterparty_flow_profiles
  field: flows_by_symbol
  supported_query_patterns:
  - counterparty_operation_symbol_matrix
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  provenance_refs:
  - trans.bank
  - trans.account
  - trans.k_symbol
  - trans.amount
  - order.bank_to
  coverage: {}
  pipeline_blueprints:
  - query_pattern: counterparty_operation_symbol_matrix
    intent: compare external-bank counterparty flow buckets by semantic payment symbol
    pipeline:
    - $project:
        bank_key: $counterparty.bank_key
        symbols:
          $objectToArray: $flows_by_symbol
    - $unwind: $symbols
    - $group:
        _id:
          bank: $bank_key
          symbol: $symbols.k
        amount_total:
          $sum: $symbols.v.amount_total
        flow_count:
          $sum: $symbols.v.flow_count
    - $sort:
        amount_total: -1
        _id.bank: 1
        _id.symbol: 1
    - $limit: 40
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $sum
