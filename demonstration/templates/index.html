<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryCraft · Text-to-MQL over schema-less MongoDB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="3.5" width="8" height="5" rx="1.5"/>
            <rect x="2.5" y="15" width="8" height="5" rx="1.5"/>
            <rect x="13.5" y="9.5" width="8" height="5" rx="1.5"/>
            <path d="M10.5 6h1.5a1.5 1.5 0 0 1 1.5 1.5v2M10.5 17.5h1.5a1.5 1.5 0 0 0 1.5-1.5v-2"/>
        </svg>
        <div class="brand-text">
            <span class="brand-name">QueryCraft</span>
            <span class="brand-tag">Text-to-MQL over schema-less MongoDB</span>
        </div>
    </div>

    <div class="grow"></div>

    <span class="chip" id="datasetChip">
        <span class="dot" id="healthDot"></span>
        <span id="datasetChipText">loading…</span>
    </span>

    <div class="seg" id="modeSeg" role="group" aria-label="Solver mode">
        <button type="button" class="seg-btn is-active" data-mode="stub"
                title="Deterministic local stub — real solver, no network">Stub</button>
        <button type="button" class="seg-btn" data-mode="live"
                title="Configured OpenAI-compatible provider">Live</button>
    </div>

    <button type="button" class="btn btn--icon" id="themeBtn" title="Toggle theme"
            aria-label="Toggle colour theme"></button>
</header>

<main class="page">
    <nav class="dbs" id="dbList" aria-label="Databases"></nav>

    <section class="card">
        <div class="card-head">
            <span class="step">1</span>
            <h2 class="card-title">Ask in plain English</h2>
            <span class="chip chip--mono" id="askDbChip">—</span>
            <span class="chip chip--ghost" id="recordChip" hidden></span>
            <div class="grow"></div>
            <button type="button" class="btn btn--sm" id="examplesBtn" aria-expanded="false">
                Benchmark questions
            </button>
        </div>
        <div class="card-body">
            <textarea id="nlq" class="nlq" rows="2" spellcheck="false"
                      placeholder="Ask anything about the selected database…"></textarea>
            <div class="examples" id="examplesList" hidden></div>
            <div class="ask-foot">
                <label class="check">
                    <input type="checkbox" id="autoRun" checked>
                    <span>Run after generating</span>
                </label>
                <div class="grow"></div>
                <span class="status" id="status" role="status" aria-live="polite"></span>
                <button type="button" class="btn btn--primary" id="generateBtn">
                    <span>Generate MQL</span>
                    <kbd id="genKbd">⌘↵</kbd>
                </button>
            </div>
        </div>
    </section>

    <section class="card" id="pipelineCard">
        <div class="card-head">
            <span class="step">2</span>
            <h2 class="card-title">MongoDB pipeline</h2>
            <span class="chip chip--mono" id="pipelineTarget" hidden></span>
            <div class="grow"></div>
            <div class="seg seg--sm" id="pipelineTabs" role="group" aria-label="Pipeline view">
                <button type="button" class="seg-btn is-active" data-view="stages">Stages</button>
                <button type="button" class="seg-btn" data-view="mql">MQL</button>
            </div>
            <button type="button" class="btn btn--sm" id="copyMqlBtn" disabled>Copy</button>
            <button type="button" class="btn btn--sm btn--exec" id="runBtn" disabled>
                <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
                <span>Run</span>
            </button>
        </div>
        <div class="flow" id="stageFlow" hidden></div>
        <div class="card-body card-body--flush" id="pipelineBody"></div>
        <div class="trace" id="trace" hidden></div>
    </section>

    <section class="card" id="resultCard">
        <div class="card-head">
            <span class="step">3</span>
            <h2 class="card-title">Result</h2>
            <span class="chip chip--exec" id="resultMeta" hidden></span>
            <div class="grow"></div>
            <div class="seg seg--sm" id="resultTabs" role="group" aria-label="Result view">
                <button type="button" class="seg-btn is-active" data-view="table">Table</button>
                <button type="button" class="seg-btn" data-view="json">JSON</button>
            </div>
            <button type="button" class="btn btn--sm" id="copyRowsBtn" disabled>Copy</button>
        </div>
        <div class="card-body card-body--flush" id="resultBody"></div>
    </section>

    <section class="card">
        <button type="button" class="card-head card-head--toggle" id="schemaToggle"
                aria-expanded="false" aria-controls="schemaPanel">
            <svg class="icon caret" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            <h2 class="card-title">What the data looks like</h2>
            <span class="chip" id="schemaSummary" hidden></span>
            <div class="grow"></div>
            <span class="head-hint" id="schemaHint">show</span>
        </button>
        <div id="schemaPanel" hidden>
            <div class="colls" id="collectionList"></div>
            <div class="schema-bar">
                <div class="seg seg--sm" id="schemaTabs" role="group" aria-label="Schema view">
                    <button type="button" class="seg-btn is-active" data-view="shape">Shape</button>
                    <button type="button" class="seg-btn" data-view="dynamic">
                        Dynamic keys <span class="badge" id="dynBadge">0</span>
                    </button>
                    <button type="button" class="seg-btn" data-view="sample">Sample document</button>
                </div>
                <div class="grow"></div>
                <span class="head-hint" id="schemaNote"></span>
            </div>
            <div class="card-body card-body--flush" id="schemaBody"></div>
        </div>
    </section>
</main>

<div class="toast" id="toast" hidden></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
