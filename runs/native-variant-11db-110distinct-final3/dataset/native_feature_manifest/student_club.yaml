db_id: student_club
features:
- id: club_event_plans_v2.budget_by_category
  type: dynamic_key_object
  collection: club_event_plans_v2
  field: budget_by_category
  supported_query_patterns:
  - student_club_budget_category_rollup
  - dynamic_key_comparison
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  provenance_refs:
  - budget.category
  - budget.amount
  - budget.spent
  - expense.cost
  coverage:
    source_tables:
    - event
    - budget
    - expense
  pipeline_blueprints:
  - query_pattern: student_club_budget_category_rollup
    intent: compare allocated and spent totals across event budget categories
    pipeline:
    - $project:
        event: $event.name
        categories:
          $objectToArray: $budget_by_category
    - $unwind: $categories
    - $group:
        _id: $categories.k
        events:
          $addToSet: $event
        allocated_total:
          $sum: $categories.v.amount_total
        spent_total:
          $sum: $categories.v.spent_total
    - $project:
        event_count:
          $size: $events
        allocated_total: 1
        spent_total: 1
    - $sort:
        spent_total: -1
        _id: 1
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $size
- id: club_event_plans_v2.attendee_finance_by_category
  type: array_object_dynamic_key
  collection: club_event_plans_v2
  field: attendance.attendees.finance_by_category
  supported_query_patterns:
  - student_club_attendee_reimbursement_chain
  - array_object_dynamic_key_comparison
  required_native_constructs:
  - $unwind
  - $objectToArray
  - $filter
  provenance_refs:
  - attendance.link_to_member
  - expense.link_to_member
  - budget.category
  coverage:
    source_tables:
    - attendance
    - member
    - expense
    - budget
  pipeline_blueprints:
  - query_pattern: student_club_attendee_reimbursement_chain
    intent: find attendees whose event participation links to category-specific expenses
    pipeline:
    - $unwind: $attendance.attendees
    - $project:
        event: $event.name
        member: $attendance.attendees.account.profile.display_name
        categories:
          $objectToArray: $attendance.attendees.finance_by_category
    - $unwind: $categories
    - $match:
        categories.v.expense_count:
          $gt: 0
    - $group:
        _id:
          event: $event
          category: $categories.k
        members:
          $addToSet: $member
        expense_total:
          $sum: $categories.v.expense_total
    - $project:
        member_count:
          $size: $members
        expense_total: 1
    mongo_native_constructs:
    - $unwind
    - $objectToArray
    - $match
    - $group
    - $size
- id: club_member_accounts_v2.member_event_timeline
  type: nested_event_stream
  collection: club_member_accounts_v2
  field: participation.events
  supported_query_patterns:
  - student_club_member_participation_timeline
  - nested_event_filter
  required_native_constructs:
  - $unwind
  - $match
  - $sort
  provenance_refs:
  - member.member_id
  - attendance.link_to_event
  - event.event_date
  coverage:
    source_tables:
    - member
    - attendance
    - event
  pipeline_blueprints:
  - query_pattern: student_club_member_participation_timeline
    intent: order each member's attended club events with event budget context
    pipeline:
    - $unwind: $participation.events
    - $project:
        member: $account.profile.display_name
        role: $account.club_role.position
        event: $participation.events.event.name
        event_date: $participation.events.event.date
        event_type: $participation.events.event.type
    - $match:
        event_date:
          $ne: null
    - $sort:
        member: 1
        event_date: 1
    mongo_native_constructs:
    - $unwind
    - $project
    - $match
    - $sort
- id: club_member_accounts_v2.income_by_source
  type: dynamic_key_object
  collection: club_member_accounts_v2
  field: finance.income_by_source
  supported_query_patterns:
  - student_club_income_source_mix
  - dynamic_key_comparison
  required_native_constructs:
  - $objectToArray
  - $group
  provenance_refs:
  - income.source
  - income.amount
  - income.link_to_member
  coverage:
    source_tables:
    - member
    - income
  pipeline_blueprints:
  - query_pattern: student_club_income_source_mix
    intent: compare dues, fundraising, sponsorship, and appropriation income by member
    pipeline:
    - $project:
        member: $account.profile.display_name
        sources:
          $objectToArray: $finance.income_by_source
    - $unwind: $sources
    - $group:
        _id: $sources.k
        amount_total:
          $sum: $sources.v.amount_total
        members:
          $addToSet: $member
    - $project:
        amount_total: 1
        member_count:
          $size: $members
    mongo_native_constructs:
    - $objectToArray
    - $unwind
    - $group
    - $size
