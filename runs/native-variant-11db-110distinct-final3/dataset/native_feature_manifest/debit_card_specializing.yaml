db_id: debit_card_specializing
features:
- id: fuel_customer_spend_profiles.consumption_by_month
  type: dynamic_key_object
  collection: fuel_customer_spend_profiles
  field: spend.consumption_by_month
  supported_query_patterns:
  - fuel_month_consumption_profile
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  - $ifNull
  provenance_refs:
  - yearmonth.Date
  - yearmonth.Consumption
  - customers.CustomerID
  coverage: {}
  pipeline_blueprints:
  - query_pattern: fuel_month_consumption_profile
    intent: roll up customer consumption from month-keyed fuel spend buckets
    pipeline:
    - $project:
        customer_id: $identity.customer_id
        segment: $identity.segment.value
        months:
          $objectToArray:
            $ifNull:
            - $spend.consumption_by_month
            - {}
    - $unwind: $months
    - $unwind: $months.v.periods
    - $group:
        _id:
          month: $months.k
          segment:
            $ifNull:
            - $segment
            - unknown_segment
        consumption_total:
          $sum: $months.v.periods.consumption
        customer_count:
          $sum: 1
    - $sort:
        _id.month: 1
        consumption_total: -1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $ifNull
    - $unwind
    - $group
    - $sum
- id: fuel_customer_spend_profiles.product_mix_by_category
  type: nested_event_stream
  collection: fuel_customer_spend_profiles
  field: transactions.events.product_mix_by_category
  supported_query_patterns:
  - fuel_basket_category_dispatch
  required_native_constructs:
  - $filter
  - $objectToArray
  - $unwind
  - $switch
  - $ifNull
  provenance_refs:
  - transactions_1k.ProductID
  - products.Description
  - transactions_1k.Price
  coverage: {}
  pipeline_blueprints:
  - query_pattern: fuel_basket_category_dispatch
    intent: filter transaction events by dynamic product-category buckets inside each
      basket
    pipeline:
    - $unwind: $transactions.events
    - $project:
        customer_id: $identity.customer_id
        event: $transactions.events
        category_buckets:
          $objectToArray:
            $ifNull:
            - $transactions.events.product_mix_by_category
            - {}
    - $addFields:
        fuel_class:
          $switch:
            branches:
            - case:
                $eq:
                - $event.basket.category
                - diesel
              then: liquid_fuel
            - case:
                $eq:
                - $event.basket.category
                - petrol
              then: liquid_fuel
            - case:
                $eq:
                - $event.basket.category
                - service
              then: non_fuel_service
            default: other_basket
    - $addFields:
        native_matching_dynamic_keys:
          $filter:
            input: $category_buckets
            as: bucket
            cond:
              $gt:
              - $size:
                  $ifNull:
                  - $$bucket.v.items
                  - []
              - 0
    - $match:
        $expr:
          $gt:
          - $size: $native_matching_dynamic_keys
          - 0
    - $group:
        _id:
          category: $event.basket.category
          fuel_class: $fuel_class
        gross_total:
          $sum: $event.payment.gross_value
        transaction_count:
          $sum: 1
    - $sort:
        gross_total: -1
        _id.category: 1
    - $limit: 25
    mongo_native_constructs:
    - $objectToArray
    - $ifNull
    - $filter
    - $switch
    - $size
    - $group
- id: fuel_station_market_catalog.station_transactions_by_date
  type: dynamic_key_object
  collection: fuel_station_market_catalog
  field: transactions_by_date
  supported_query_patterns:
  - station_market_day_payment_rollup
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  - $ifNull
  provenance_refs:
  - gasstations.GasStationID
  - gasstations.Country
  - transactions_1k.Date
  - transactions_1k.Price
  coverage: {}
  pipeline_blueprints:
  - query_pattern: station_market_day_payment_rollup
    intent: aggregate station payments through date-keyed merchant timelines
    pipeline:
    - $project:
        station_id: $identity.station_id
        country: $merchant_dimension.country
        days:
          $objectToArray:
            $ifNull:
            - $transactions_by_date
            - {}
    - $unwind: $days
    - $unwind: $days.v.payments
    - $group:
        _id:
          country:
            $ifNull:
            - $country
            - unknown_country
          date: $days.k
        gross_total:
          $sum: $days.v.payments.payment.gross_value
        station_count:
          $addToSet: $station_id
    - $project:
        _id: 0
        country: $_id.country
        date: $_id.date
        gross_total: 1
        station_count:
          $size: $station_count
    - $sort:
        gross_total: -1
        country: 1
        date: 1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $ifNull
    - $unwind
    - $group
    - $sum
    - $size
- id: fuel_product_payment_timeline.product_day_station_buckets
  type: dynamic_key_object
  collection: fuel_product_payment_timeline
  field: payment_timeline.by_date
  supported_query_patterns:
  - product_day_station_bucket_matrix
  required_native_constructs:
  - $objectToArray
  - $unwind
  - $group
  - $sum
  - $filter
  - $ifNull
  provenance_refs:
  - products.ProductID
  - transactions_1k.Date
  - transactions_1k.GasStationID
  - transactions_1k.Amount
  coverage: {}
  pipeline_blueprints:
  - query_pattern: product_day_station_bucket_matrix
    intent: traverse product date buckets and nested station-id buckets for payment
      timelines
    pipeline:
    - $project:
        product_id: $identity.product_id
        category: $identity.category
        days:
          $objectToArray:
            $ifNull:
            - $payment_timeline.by_date
            - {}
    - $unwind: $days
    - $project:
        product_id: 1
        category: 1
        date: $days.k
        stations:
          $objectToArray:
            $ifNull:
            - $days.v.station_buckets_by_station_id
            - {}
    - $addFields:
        active_stations:
          $filter:
            input: $stations
            as: station
            cond:
              $gt:
              - $size:
                  $ifNull:
                  - $$station.v
                  - []
              - 0
    - $unwind: $active_stations
    - $unwind: $active_stations.v
    - $group:
        _id:
          category: $category
          date: $date
          station_id: $active_stations.k
        amount_total:
          $sum: $active_stations.v.payment.amount
        gross_total:
          $sum: $active_stations.v.payment.gross_value
        transaction_count:
          $sum: 1
    - $sort:
        gross_total: -1
        _id.category: 1
        _id.date: 1
    - $limit: 50
    mongo_native_constructs:
    - $objectToArray
    - $ifNull
    - $filter
    - $size
    - $unwind
    - $group
    - $sum
